[package]
name = "caac"
version = "0.10.1"
edition = "2024"

[dependencies]
comrak = { version = "=0.59.0", default-features = false }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
sha2 = "=0.11.1"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }

tree-sitter = { version = "=0.27.2", default-features = false, features = ["std"] }
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"
