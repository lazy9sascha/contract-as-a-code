[package]
name = "caac"
version = "0.9.1"
edition = "2024"

[dependencies]
comrak = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
tempfile = "=3.27.0"
